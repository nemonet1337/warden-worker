[toolchain]
# Pin for reproducible builds. Bump this intentionally (and with Cargo.lock) when upgrading.
# 1.91.1 is too old for current rust-analyzer VS Code extensions; pin a current stable
# and include the rust-analyzer component so the IDE uses a matching language server.
channel = "1.98.0"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-analyzer", "rust-src"]
targets = ["wasm32-unknown-unknown"]
